name: Program değişikliği izle

# Yarış günü içinde TJK programı değişebiliyor (yağmurda çim koşuların kuma
# alınması, mesafe değişikliği, koşmaz atlar, jokey değişimi). Bu iş programı
# düzenli aralıkla yeniden çekip farkı yakalar, data/'yı günceller ve telefona
# bildirim gönderir. Web arayüzü degisiklik-{şehir}.json'u okuyup uyarı şeridi
# gösterir ve etkilenen koşuları yeniden puanlar.

on:
  schedule:
    # 07:00–21:00 TR (04:00–18:00 UTC) arası 20 dakikada bir.
    - cron: "*/20 4-18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: program-izle
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Programı TJK ile karşılaştır
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/izle_program.py

      - name: Değişiklikleri işle
        run: |
          git config user.name "altili-bulan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Program değişmedi."
          else
            git commit -m "Program güncellemesi: $(date -u +%Y-%m-%d' '%H:%M) UTC"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push reddedildi, rebase edip yeniden deneniyor ($i/3)…"
              git pull --rebase origin main
            done
          fi
